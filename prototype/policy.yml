# Orchestra policy — proto-default (P4). Project override: <repo>/.orchestra/policy.yml
version: 1

roles:
  coder:
    description: "Implement in a worktree"
    permission_profile: worktree-write
    budget: { usd: 2.00, minutes: 8 }
  planner:
    description: "Read code, produce a plan"
    permission_profile: readonly
    budget: { usd: 1.00, minutes: 5 }
  verifier:
    description: "Run the test suite independently"
    permission_profile: verify-only
    budget: { usd: 0.50, minutes: 4 }
  reviewer:
    description: "Review diff cross-CLI"
    permission_profile: readonly
    budget: { usd: 1.00, minutes: 4 }
  fixer:
    description: "Fix based on verify/review feedback"
    permission_profile: worktree-write
    budget: { usd: 1.00, minutes: 4 }

bindings:
  coder:
    # model in a binding = a dedicated model for that CLI when it fills this role
    # (empty = the CLI's own default model; per-run override: dispatch --model)
    - worker: { cli: codex }        # , model: worker-codex }
      boost_when: { tags: [refactor, backend, performance] }
    - worker: { cli: claude }       # , model: worker-claude }
      boost_when: { tags: [ui, architecture, payment] }
  planner:
    - worker: { cli: claude }
    - worker: { cli: codex }
  verifier:
    - worker: { cli: claude }
    - worker: { cli: codex }
  reviewer:
    - worker: { cli: claude }
    - worker: { cli: codex }
  fixer:
    - worker: { cli: codex }
    - worker: { cli: claude }

routing:
  weights: { track_record: 0.4, health: 0.2, cost: 0.2, preference: 0.1, speed: 0.1 }
  min_sample: 5        # P4: lowered so the demo works with simulated data (spec default is 10)
  decay_days: 30
  budget_mode: balanced

fleet_constraints:
  cross_review: required
  max_parallel_tasks: 3

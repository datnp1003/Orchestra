# Orchestra policy — proto-default (P4). Project override: <repo>/.orchestra/policy.yml
version: 1

roles:
  coder:
    description: "Implement trong worktree"
    permission_profile: worktree-write
    budget: { usd: 2.00, minutes: 8 }
  planner:
    description: "Đọc code, sinh plan"
    permission_profile: readonly
    budget: { usd: 1.00, minutes: 5 }
  verifier:
    description: "Chạy test suite độc lập"
    permission_profile: verify-only
    budget: { usd: 0.50, minutes: 4 }
  reviewer:
    description: "Review diff cross-CLI"
    permission_profile: readonly
    budget: { usd: 1.00, minutes: 4 }
  fixer:
    description: "Sửa theo feedback verify/review"
    permission_profile: worktree-write
    budget: { usd: 1.00, minutes: 4 }

bindings:
  coder:
    # model trong binding = gán model riêng cho CLI đó khi đảm nhiệm role này
    # (để trống = CLI dùng model mặc định của nó; override từng lần: dispatch --model)
    - worker: { cli: codex }        # , model: worker-codex }
      boost_when: { tags: [refactor, backend, performance] }
    - worker: { cli: claude }       # , model: worker-claude }
      boost_when: { tags: [ui, architecture, payment] }
  planner:
    - worker: { cli: claude }
    - worker: { cli: codex }
  verifier:
    - worker: { cli: claude }
    - worker: { cli: codex }
  reviewer:
    - worker: { cli: claude }
    - worker: { cli: codex }
  fixer:
    - worker: { cli: codex }
    - worker: { cli: claude }

routing:
  weights: { track_record: 0.4, health: 0.2, cost: 0.2, preference: 0.1, speed: 0.1 }
  min_sample: 5        # P4: hạ để demo được với số liệu mô phỏng (mặc định spec là 10)
  decay_days: 30
  budget_mode: balanced

fleet_constraints:
  cross_review: required
  max_parallel_tasks: 3

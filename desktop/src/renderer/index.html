<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="styles.css" />
  <title>Orchestra Desktop</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><img class="brand-mark" src="../../assets/icon.png" alt="" />ORCHESTRA</div>
      <button id="newChat" class="btn-primary btn-new" data-i18n="desktop.newChat.label" data-i18n-title="desktop.newChat.title"></button>
      <button id="approvalBadge" class="approval-badge" hidden></button>

      <div id="sideLists">
        <div class="side-section">
          <div class="side-title side-head"><span data-i18n="desktop.projects.title"></span><button id="newProject" class="side-plus" data-i18n-title="desktop.projects.new">＋</button></div>
          <input id="newProjectName" class="side-input" data-i18n-placeholder="desktop.projects.namePlaceholder" autocomplete="off" hidden />
          <div id="sideProjects"></div>
        </div>
        <div class="side-section">
          <div class="side-title side-head"><span data-i18n="desktop.chats.title"></span><button id="newChatPlus" class="side-plus" data-i18n-title="desktop.newChat.title">＋</button></div>
          <div id="sideChats"></div>
        </div>
      </div>

      <div id="sideFooter">
        <a id="navDashboard" class="side-link side-icon" href="#/dashboard" data-page="dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <button id="btnSettings" data-i18n-title="desktop.settings.title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="desktop.page.settings"></span>
        </button>
      </div>
    </aside>

    <div id="main">
      <header id="topbar">
        <div id="pageTitle">Chat</div>
        <span id="pageRepo" class="page-repo"></span>
        <div class="topbar-right">
          <div id="fleetPill" data-i18n-title="desktop.fleet.pillTitle"></div>
        </div>
      </header>

      <main id="page"></main>

      <div id="composerWrap" hidden>
        <div id="emptyHero" class="empty-only">
          <img class="empty-icon" src="../../assets/hero.png" alt="" />
          <div class="empty-title" data-i18n="desktop.empty.title"></div>
          <div id="emptyCtx" class="empty-ctx"></div>
        </div>
        <div id="composer">
          <span class="composer-caret">›</span>
          <textarea id="chatInput" rows="1" data-i18n-placeholder="desktop.composer.placeholder"></textarea>
          <button id="chatStop" class="secondary" data-i18n="desktop.composer.stop" data-i18n-title="desktop.composer.stopTitle" hidden></button>
          <button id="chatSend" data-i18n-title="desktop.composer.sendTitle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
        <div class="composer-hints">
          <span><b>Enter</b> <span data-i18n="desktop.composer.hintSend"></span></span>
          <span><b>Shift+Enter</b> <span data-i18n="desktop.composer.hintNewline"></span></span>
          <span id="composerBrain">
            <button id="cbNew" class="secondary" data-i18n="desktop.composer.newChat" data-i18n-title="desktop.newChat.title"></button>
            <select id="cbModel" data-i18n-title="desktop.composer.modelTitle"></select>
            <span class="mode-wrap">
              <button id="cbMode" class="secondary" data-i18n-title="desktop.mode.title" aria-haspopup="true"></button>
              <div id="modeMenu" class="mode-menu" role="menu" hidden></div>
            </span>
          </span>
        </div>
        <div id="emptyChips" class="empty-only">
          <button class="secondary chip" data-i18n="desktop.empty.chip1"></button>
          <button class="secondary chip" data-i18n="desktop.empty.chip2"></button>
          <button class="secondary chip" data-i18n="desktop.empty.chip3"></button>
          <button class="secondary chip" data-i18n="desktop.empty.chip4"></button>
        </div>
      </div>

      <footer id="statusbar">
        <span id="stWorker"></span>
        <span class="sep">·</span>
        <span id="stRepo"></span>
        <span class="sep">·</span>
        <span id="stMode"></span>
        <span class="spacer"></span>
      </footer>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
